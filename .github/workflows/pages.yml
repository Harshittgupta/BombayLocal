name: Demo site

# Publishes the live demo (web/: two-phone simulator) at the site root and the audit page at /audit/ to GitHub Pages.
# The site is static: everything the browser runs is built here from this commit (protocol/, circuit artifacts that
# must match circuits/artifacts/manifest.json, audit/index.html). One-time setup: Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "audit/**"
      - "protocol/**"
      - "circuits/artifacts/**"
      - "apps/passenger/app/src/main/assets/www/**"
      - "deployments.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
      - name: Install (pinned lockfiles)
        run: |
          npm ci --prefix protocol --ignore-scripts
          npm ci --prefix web --ignore-scripts
      - name: Browser scanner conformance (fixtures/qr, same suite as the Kotlin scanner)
        run: npm test --prefix web
      - name: Build the site
        run: npm run build --prefix web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/_site
      - id: deployment
        uses: actions/deploy-pages@v4
