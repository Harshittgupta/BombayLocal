name: CI

on: [push]

jobs:
  no-trackers:
    name: No third-party trackers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep for analytics / tracker SDKs in apps/
        run: |
          if [ ! -d apps ]; then
            echo "apps/ not found yet — skipping (will fail once apps exist)"
            exit 0
          fi
          if grep -rniE "analytics|firebase|crashlytics|mixpanel|amplitude|sentry|mlkit|google-services|play-services" apps/; then
            echo "::error::Found tracker references in apps/"
            exit 1
          fi
          echo "Clean: no trackers found."

  no-mocks:
    name: No mocks outside tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep for mock/fake/stub/dummy/hardcod outside allowed dirs
        run: |
          HITS=$(grep -rniI "mock\|fake\|stub\|dummy\|hardcod" \
            --exclude-dir=test --exclude-dir=tests --exclude-dir=__tests__ \
            --exclude-dir=androidTest \
            --exclude-dir=fixtures --exclude-dir=docs --exclude-dir=.claude \
            --exclude-dir=.github --exclude-dir=.git \
            --exclude-dir=node_modules --exclude-dir=lib \
            --exclude="*.test.*" --exclude="*.spec.*" \
            --exclude="*.lock" --exclude="package-lock.json" --exclude="pnpm-lock.yaml" \
            --exclude="CLAUDE.md" --exclude="SPEC.md" \
            --exclude="BUILD_PLAN.md" --exclude="BOUNTIES.md" \
            --exclude="HANDOFF.md" --exclude="REVIEWS.md" \
            --exclude="README.md" --exclude="DEMO.md" \
            --exclude="LICENSE" \
            . | grep -v "issuer/src/purchase.ts" || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::Found mock/fake/stub/dummy/hardcod outside allowed locations"
            exit 1
          fi
          echo "Clean: no mocks outside tests/fixtures/docs."

  tests:
    name: Protocol and circuit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: protocol (unit tests)
        working-directory: protocol
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: circuits (real Groth16 proofs from committed artifacts, fixtures re-verified)
        working-directory: circuits
        run: |
          npm ci
          npm run typecheck
          npm test
